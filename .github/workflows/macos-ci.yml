name: macOS CI

on:
  push:
    branches:
      - main
      - feat/hermes-dashboard-remote-access
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      test_scope:
        description: "Test scope"
        required: true
        type: choice
        options:
          - focused
          - full
        default: focused

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-build-and-test:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      TEST_SCOPE: ${{ github.event.inputs.test_scope || 'focused' }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Report toolchain
        run: |
          xcodebuild -version
          swift --version
          sw_vers

      - name: Ensure Metal toolchain is available
        run: |
          if ! xcrun -f metal >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi

      - name: Resolve Xcode package dependencies
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project scarf/scarf.xcodeproj \
            -scheme scarf

      - name: Set up Python for YAML round-trip tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML test dependency
        run: |
          python3 -m pip install --disable-pip-version-check PyYAML
          python3 -c "import yaml; print('PyYAML ' + yaml.__version__)"

      - name: Test ScarfCore Swift package
        # The previous focused filter targeted the deleted Dashboard tunnel tests.
        # Run the real package suite in both modes; the macOS app step stays focused.
        run: swift test --package-path scarf/Packages/ScarfCore

      - name: Build macOS app
        run: |
          xcodebuild \
            -project scarf/scarf.xcodeproj \
            -scheme scarf \
            -skipPackagePluginValidation \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/ScarfDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      # Pushes/PRs cover direct Web Chat URL validation plus the pre-existing
      # local Dashboard regressions. Full scope remains manually selectable.
      # Credentialed UI release-gate tests remain excluded in both modes.
      - name: Run macOS unit tests
        run: |
          if [[ "$TEST_SCOPE" == "full" ]]; then
            TEST_FILTERS=(-only-testing:scarfTests)
          else
            TEST_FILTERS=(
              -only-testing:scarfTests/HermesWebChatURLTests
              -only-testing:scarfTests/WebDashboardGateTests
            )
          fi

          xcodebuild \
            -project scarf/scarf.xcodeproj \
            -scheme scarf \
            -testPlan Full \
            -skipPackagePluginValidation \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/ScarfDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/ScarfUnitTests.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            "${TEST_FILTERS[@]}" \
            test

      - name: Package macOS app
        if: success()
        run: |
          APP_DIR="$RUNNER_TEMP/ScarfDerivedData/Build/Products/Debug"
          APP_PATH="$(find "$APP_DIR" -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [[ -z "$APP_PATH" ]]; then
            echo "No .app bundle found in $APP_DIR" >&2
            find "$APP_DIR" -maxdepth 2 -print || true
            exit 1
          fi
          ZIP_PATH="$RUNNER_TEMP/Scarf-macOS-${GITHUB_SHA:0:7}.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$ZIP_PATH"
          shasum -a 256 "$ZIP_PATH"

      - name: Upload macOS app artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: scarf-macos-debug-app
          path: ${{ runner.temp }}/Scarf-macOS-*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload XCTest result bundle on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scarf-unit-test-results
          path: ${{ runner.temp }}/ScarfUnitTests.xcresult
          if-no-files-found: ignore
          retention-days: 7
