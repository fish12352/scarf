name: macOS CI

on:
  push:
    branches:
      - main
      - feat/hermes-dashboard-remote-access
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      test_scope:
        description: "Test scope"
        required: true
        type: choice
        options:
          - focused
          - full
        default: focused

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-build-and-test:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      TEST_SCOPE: ${{ github.event.inputs.test_scope || 'focused' }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Report toolchain
        run: |
          xcodebuild -version
          swift --version
          sw_vers

      - name: Ensure Metal toolchain is available
        run: |
          if ! xcrun -f metal >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi

      - name: Resolve Xcode package dependencies
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project scarf/scarf.xcodeproj \
            -scheme scarf

      - name: Set up Python for YAML round-trip tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML test dependency
        run: |
          python3 -m pip install --disable-pip-version-check PyYAML
          python3 -c "import yaml; print('PyYAML ' + yaml.__version__)"

      - name: Test ScarfCore Swift package
        run: |
          if [[ "$TEST_SCOPE" == "full" ]]; then
            swift test --package-path scarf/Packages/ScarfCore
          else
            swift test --package-path scarf/Packages/ScarfCore --filter SSHTransportPortForwardTests
          fi

      - name: Build macOS app
        run: |
          xcodebuild \
            -project scarf/scarf.xcodeproj \
            -scheme scarf \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/ScarfDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      # Full scope is available via workflow_dispatch. Pushes/PRs run
      # the regression suite directly related to the remote Dashboard work.
      # Credentialed UI release-gate tests remain excluded in both modes.
      - name: Run macOS unit tests
        run: |
          if [[ "$TEST_SCOPE" == "full" ]]; then
            TEST_FILTER="-only-testing:scarfTests"
          else
            TEST_FILTER="-only-testing:scarfTests/WebDashboardGateTests"
          fi

          xcodebuild \
            -project scarf/scarf.xcodeproj \
            -scheme scarf \
            -testPlan Full \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/ScarfDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/ScarfUnitTests.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            "$TEST_FILTER" \
            test

      - name: Upload XCTest result bundle on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scarf-unit-test-results
          path: ${{ runner.temp }}/ScarfUnitTests.xcresult
          if-no-files-found: ignore
          retention-days: 7
